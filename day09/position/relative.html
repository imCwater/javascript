<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        li:nth-child(1){
            background-color: rgb(255, 70, 101);
        }
        li:nth-child(2){
            background-color: rgb(165, 255, 81);
            position: relative;  /* left, top, bottom, right */
            left: 20px;
        }
        li:nth-child(3){
            background-color: rgb(0, 183, 255);
        }
        li:nth-child(4){
            background-color: rgb(195, 0, 255);
        }
    </style>
</head>
<body>
    <!-- 
    relative는 자신의 위치를 지킴 그 위치에서 left, top, bottom, right 사용가능
    position: absolute의 부모로 사용되는 영역에 주로 사용됨
    -->
    <ul>
        <li>1</li>
        <li>2</li>
        <li>3</li>
        <li>4</li>
    </ul>
    
</body>
</html>
