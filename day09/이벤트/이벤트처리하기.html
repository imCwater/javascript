<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function clickHandler(){
            alert("sksksks");
        }
    </script>
</head>
<body>
    <!-- click => 이벤트 -->
    <!-- 이벤트리스너 => onclick -->
    <!-- 이벤트핸들러 => clickHandler 함수 -->
    <button onclick="alert('HI');">클릭해봐 !!</button>
    <button onclick="clickHandler()">클릭해봐</button>
</body>
</html>
