<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        
        function addImgTag(){
            //alert("sdf");

            //태그생성
            const img = document.createElement("img"); 
            img.src = "https://i-bloom.shop/cdn/shop/files/230526___7_adffe927-7077-477b-9ff9-16e0481c4b9b.jpg?v=1761809383&width=1445";
            img.alt = "메론빵";
            img.style.width = "300px";
            img.style.height = "300px";

            
            //부모영역 선택하기
            const result = document.getElementById("result");
            console.log(result);

            //부모영역에 추가하기
            result.appendChild(img);
            

        }
    </script>
</head>
<body>
    <button onclick="addImgTag()">이미지 태그 생성</button>
    <div id="result"> </div>
</body>
</html>
