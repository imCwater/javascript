<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .style1{
            border: 1px solid black;
            padding: 5px;
            margin-left: 30px; /* inline = > 패딩 가능, 마진-왼쪽, 오른쪽 가능/ 위,아래 불가능 */
            /* margin-top: 300px;  이 속성은 안됨 */

        }
    </style>
    <script>
        
        function addATag(){
            //alert("sdf");

            //태그생성
            const a = document.createElement("a"); 
            a.href = "htpps://ww.naver.com";
            a.target = "_blank";
            a.textContent = "Naver로 ~~";
            a.classList.add("style1");
            
            //부모영역 선택하기
            const result = document.getElementById("result");
            console.log(result);

            //부모영역에 추가하기
            result.appendChild(a);
            

        }
    </script>
</head>
<body>
    <button onclick="addATag()">a 태그 생성</button>
    <div id="result"> </div>
</body>
</html>
