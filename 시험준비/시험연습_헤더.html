<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      header{
        height: 100px;
        background: skyblue;
        position: relative;
      }

      nav{
        padding: 10px;
        background-color: aqua;
      }
      footer{
        height: 100px;
        background-color: blue;
        display: flex;
      }
      .footer-item{
        border: 1px solid black;
        width: 33.3%;
        padding: 10px;
      }
      .title{
        background-color: thistle;
        width: 100px;

        position: absolute;
        top: 10px;
        left: 20px;
      }

      /* 검색바 */
      .search-bar{
        width: 200px;
        height: 40px;
        border: 1px solid black;
        display: flex;
        position: absolute;
        right: 10px;
        bottom: 10px;
      }
      .search-text{
        width: 160px;
        border: none;
        outline: none;
        padding: 10px;
        box-sizing: border-box;
      }
      .search-img{
        width: 40px;
        background-image: url(https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRPcmoFIvEnHab-ZJBVqx0QGqgx0eLfio1h_g&s);
        background-size: cover;
      }

      /* nav */
      nav ul{
        list-style: none;
        display: flex;
      }
      nav ul li{
        padding-right: 10px;
      }
      a{
        text-decoration: none;
        color: aliceblue;
      }

      /* 로그인 */
      section{
        padding: 60px 0;
      }
      .login-wrap{
        width: 400px;
        border: 1px solid black;
        margin: 0 auto;
        padding: 20px;
        
      }
      .image-wrap{
        width: 200px;
        height: 200px;
        margin: 0 auto;
      }
      .img-wrap img{
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .user-info-wrap{
        margin-top: 30px;
      }
      .user-info-wrap input,
      .user-info-wrap button{
        width: 100%;
        padding: 10px;
        margin-bottom: 10px;
        box-sizing: border-box;
      }
      
    </style>
  </head>
  <body>
    <header>
      <div class="title">title</div>

      <!-- 검색바 -->
      <div class="search-bar">
        <input type="text" class="search-text" />
        <div class="search-img"></div>
      </div>
    </header>

    <!-- nav -->
    <nav>
      <ul>
        <li><a href="">홈으로</a></li>
        <li><a href="">로그인</a></li>
        <li><a href="">회원가입</a></li>
      </ul>
    </nav>

    <!-- 로그인 -->
     <section class="login-wrap">
        <div class="img-wrap">
            <img src="https://cdn-icons-png.flaticon.com/512/5087/5087579.png" alt="">
        </div>
        <div class="user-info-wrap">
            <input type="text" placeholder="아이디">
            <input type="password" placeholder="비밀번호">
            <button>로그인</button>
        </div>
     </section>

     <!-- 푸터 -->
      <footer>
        <div class="footer-item">Acorn</div>
        <div class="footer-item">연락처</div>
        <div class="footer-item">기본정보</div>
      </footer>
  </body>
</html>
