<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        header{
            height: 100px;
            background-color: antiquewhite;

            position: relative;
        }

        /* 검색바 */
        nav{
            padding: 10px;
            background-color: aqua;
        }

        footer{
            height: 100px;
            background-color: blue;

            display: flex;
        }

        /* 로고 */
        .title{
            position: absolute;
            /* border: 1px solid red; */
            top: 10px;
            left: 20px;
        }
        .title img{
            height: 70px;
            width: auto;
        }

        /* 검색바 */
        .search-bar{
            width: 200px;
            height: 40px;
            border: 1px solid black;
            display: flex;

            position: absolute;
            right: 10px;
            bottom: 10px;
        }
        .search-text{
            width: 160px;
            border: none;
            outline: none;
            padding: 10px;
            box-sizing: border-box;
        }
        .search-img{
            width: 40px;
            /* border: 1px solid black;
            background-color: red; */
            background-image: url(https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRPcmoFIvEnHab-ZJBVqx0QGqgx0eLfio1h_g&s);
            background-size: cover;
            background-position: center;
        }

        /* nav */
        nav ul{
            list-style: none;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin: 0;
            padding: 0;
        }
        a{
            text-decoration: none;
            color: aliceblue;
        }

        /* section 로그인 */
        section {
            padding: 80px 0;
        }
        .login-wrap{
            width: 400px;
            border: 1px solid black;
            margin: 0 auto;
            padding: 20px;
            text-align: center;
        }
        .image-wrap{
            width: 150px;
            height: 150px;
            margin: 0 auto;
        }

        .image-wrap img{
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .user-info-wrap{
            margin-top: 20px;
        }

        .user-info-wrap input,
        .user-info-wrap button{
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            box-sizing: border-box;
        }
        

        /* footer */
        .footer-item{
            border: 1px solid red;
            flex: 1;
            padding: 10px;
        }
    </style>
</head>
<body>
    <header>
        <!-- 제목 -->
        <div class="title">
            <img src="https://cdn-icons-png.flaticon.com/512/14/14415.png" alt="">
        </div>

        <!-- 검색바 -->
         <div class="search-bar">
            <input type="text" class="search-text">
            <div class="search-img"></div>
         </div>
    </header>

    <nav>
        <ul>
            <li><a href="시험연습_헤더 copy.html">홈으로</a></li>
            <li><a href="시험연습_로그인 copy.html">로그인</a></li>
        </ul>
    </nav>

    <!-- 로그인 -->
    <section>
        <div class="login-wrap">
            <!-- 로그인 이미지 -->
             <div class="image-wrap">
                <img src="https://cdn-icons-png.flaticon.com/512/5087/5087579.png" alt="">
             </div>

             <!-- 입력 -->
              <div class="user-info-wrap">
                <!-- id필수 -->
                <input type="text" id="userId" placeholder="아이디">
                <input type="password" id="userPw" placeholder="비밀번호">
                <button onclick="checkLogin()">로그인</button>
              </div>
        </div>
    </section>

    <footer>
        <div class="footer-item">Acorn</div>
        <div class="footer-item">연락처</div>
        <div class="footer-item">기본정보</div>
    </footer>
</body>
<script>
    function checkLogin(){
        const id = document.getElementById("userId");
        const pw = document.getElementById("userPw");

        if(id.value === ""){
            alert("아이디를 입력하세요");
            id.focus();
            return;
        }
        if(pw.value === ""){
            alert("비밀번호를 입력하세요");
            id.focus();
            return;
        }
        alert("로그인 성공!");
    }
</script>
</html>
